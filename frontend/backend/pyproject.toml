[tool.poetry]
name = "foreact-studio-backend"
version = "0.1.0"
description = "ForeACT model-driven forecast actionability backend"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
flask = "^3.0.3"
flask-cors = "^4.0.1"
pandas = "^2.2.2"
numpy = "^1.26.4"
scikit-learn = "^1.5.1"
python-dotenv = "^1.0.1"
pyecore = "^0.15.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
ruff = "^0.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
